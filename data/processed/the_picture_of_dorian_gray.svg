<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 950" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0033"/><stop offset="100%" stop-color="#000000"/></linearGradient>
        <radialGradient id="catGradFear" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#2a0000"/><stop offset="100%" stop-color="#000000"/></radialGradient>
        <radialGradient id="catGradSweet" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#2c3e50"/><stop offset="100%" stop-color="#0f172a"/></radialGradient>
        <!-- Cheshire Fade: Magenta fades entirely into transparency at the edges/bottom -->
        <radialGradient id="catGradAbsurd" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#cc00ff" stop-opacity="0.8"/><stop offset="100%" stop-color="#4a0080" stop-opacity="0.0"/></radialGradient>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
            <feMerge><feMergeNode in="blur2" /><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
        </filter>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="81" cy="113" r="30" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="162" cy="226" r="50" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="243" cy="339" r="70" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="324" cy="452" r="90" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="405" cy="565" r="10" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="486" cy="678" r="30" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="67" cy="791" r="50" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="148" cy="104" r="70" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="229" cy="217" r="90" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="310" cy="330" r="10" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/><circle cx="391" cy="443" r="30" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3" filter="url(#glow)" stroke-dasharray="5 10"/>
    
    <circle cx="250" cy="300" r="180" fill="#ff00ff" opacity="0.04" filter="url(#glow)"/>
    
    <!-- Queue -->
    <path d="M 250 500 Q 290 508.5, 226 528.5 Q 338 537.0, 274 557.0 Q 254 564.0, 238 584.0 Q 338 585.0, 274 605.0 Q 254 612.0, 238 632.0 Q 338 640.5, 274 660.5 Q 270 663.0, 214 683.0 Q 330 690.0, 274 710.0 Q 242 715.5, 178 735.5 Q 370 733.5, 346 753.5 Q 170 750.0, 154 770.0 Q 386 771.0, 322 791.0 Q 206 795.0, 190 815.0 Q 422 813.0, 358 833.0 Q 170 837.0, 154 857.0 Q 322 864.0, 274 884.0 Q 214 882.0, 166 902.0 Q 314 909.0, 274 929.0 Q 198 928.5, 142 948.5 Q 362 954.0, 298 974.0 Q 242 972.0, 178 992.0 " fill="none" stroke="#ff00ff" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" opacity="0.7" stroke-dasharray="10 15"/>
    <path d="M 250 500 Q 290 508.5, 226 528.5 Q 338 537.0, 274 557.0 Q 254 564.0, 238 584.0 Q 338 585.0, 274 605.0 Q 254 612.0, 238 632.0 Q 338 640.5, 274 660.5 Q 270 663.0, 214 683.0 Q 330 690.0, 274 710.0 Q 242 715.5, 178 735.5 Q 370 733.5, 346 753.5 Q 170 750.0, 154 770.0 Q 386 771.0, 322 791.0 Q 206 795.0, 190 815.0 Q 422 813.0, 358 833.0 Q 170 837.0, 154 857.0 Q 322 864.0, 274 884.0 Q 214 882.0, 166 902.0 Q 314 909.0, 274 929.0 Q 198 928.5, 142 948.5 Q 362 954.0, 298 974.0 Q 242 972.0, 178 992.0 " fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.7" stroke-dasharray="10 15"/>
    
    <!-- Corps & Tête -->
    <path d="M 210 230 Q 84.85714285714286 350, 200 500 Q 250 550, 300 500 Q 415.1428571428571 350, 290 230 Z" fill="url(#catGradAbsurd)" filter="url(#shadow)"/>
    <path d="M 250 240 C 160 250, 170 150, 180 130 Q 140 44.85714285714286, 200 110 Q 250 130, 300 110 Q 395.1428571428571 70, 320 140 C 330 160, 330 230, 250 240 Z" fill="url(#catGradAbsurd)" filter="url(#shadow)"/>
    
    <!-- Visage -->
    <circle cx="195" cy="140" r="16" fill="#00ffcc" filter="url(#glow)"/><circle cx="195" cy="140" r="6" fill="#000"/>
    <circle cx="305" cy="130" r="9" fill="#00ffcc" filter="url(#glow)"/><polygon points="300,125 310,135 300,135" fill="#000"/>
    <path d="M 180 175 Q 250 208.42857142857142 320 175 Q 250 215 180 175 Z" fill="#ffffff" filter="url(#glow)" opacity="0.8"/>
    
    <text x="250" y="900" font-family="Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="6" opacity="0.9" filter="url(#shadow)">THE PICTURE OF DORIAN GRAY</text>
    <text x="250" y="925" font-family="Arial, sans-serif" font-size="10" fill="#ff00ff" text-anchor="middle" letter-spacing="4" opacity="0.6">EMOTIONAL DATA PORTRAIT</text>
    </svg>