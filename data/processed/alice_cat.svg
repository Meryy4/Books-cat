<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0b1a2e" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg)"/>
    
    <!-- Ligne de vie narrative (La queue) -->
    <path d="M 200 240 S 179.0 249, 158 258 S 221.0 267, 242 276 S 193.0 285, 186 294 S 224.5 303, 249 312 S 193.0 321, 186 330 S 217.5 339, 235 348 S 193.0 357, 186 366 S 221.0 375, 242 384 S 193.0 393, 186 402 S 207.0 411, 214 420 S 193.0 429, 186 438 S 207.0 447, 214 456 " fill="none" stroke="hsl(298, 80%, 65%)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
    
    <!-- Silhouette du crâne -->
    <path d="M 200 240 C 130 240, 130 160, 140 140 Q 120 85.33333333333333, 160 120 Q 200 144.0, 240 120 Q 280 85.33333333333333, 260 140 C 270 160, 270 240, 200 240 Z" fill="none" stroke="hsl(298, 80%, 65%)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Yeux -->
    <path d="M 155 170 Q 170 164.83333333333334, 185 170 Q 170 175.16666666666666, 155 170" fill="hsl(298, 80%, 65%)" filter="url(#glow)"/>
    <path d="M 215 170 Q 230 164.83333333333334, 245 170 Q 230 175.16666666666666, 215 170" fill="hsl(298, 80%, 65%)" filter="url(#glow)"/>
    
    <!-- Optionnel : Un léger losange pour le nez -->
