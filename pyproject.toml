[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcats"
version = "0.2.0"
description = "If this book were a cat: data-driven cat portraits of classic novels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "nrclex>=3.0",
]

[project.optional-dependencies]
transformer = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
bookcats = "bookcats.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
